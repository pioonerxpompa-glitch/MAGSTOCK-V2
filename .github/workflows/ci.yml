name: MAGSTOCK CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix apps/api install
      - run: npm --prefix apps/web install
      - run: npm --prefix apps/api run build
      - run: npm --prefix apps/web run build
