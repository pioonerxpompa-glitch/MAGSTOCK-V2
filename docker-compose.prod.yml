services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-magstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-magstock}
    volumes:
      - magstock_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-magstock}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-magstock}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PIN: ${ADMIN_PIN}
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "4000:4000"

volumes:
  magstock_pg:
